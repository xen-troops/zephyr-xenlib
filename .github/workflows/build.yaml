name: Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  sdk_version: ${{ vars.SDK_VERSION || '1.0.1' }}
  zephyr_revision: ${{ vars.ZEPHYR_REVISION || 'main' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install west pyelftools protobuf grpcio-tools jsonschema
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler gperf

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ runner.os }}-zephyr-sdk-${{ env.sdk_version }}

      - name: Download Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir sdk
          cd sdk
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.sdk_version }}/zephyr-sdk-${{ env.sdk_version }}_linux-x86_64_gnu.tar.xz
          tar xf zephyr-sdk-${{ env.sdk_version }}_linux-x86_64_gnu.tar.xz
          rm zephyr-sdk-${{ env.sdk_version }}_linux-x86_64_gnu.tar.xz

      - name: Install Zephyr SDK
        run: |
          cd sdk/zephyr-sdk-${{ env.sdk_version }}
          ./setup.sh -t all -h -c

      - name: Check out Zephyr
        uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ env.zephyr_revision }}
          path: zephyr

      - name: Environment setup
        run: |
          west init -l zephyr
          west update

      - name: Check out zephyr-xenlib
        uses: actions/checkout@v4
        with:
          path: zephyr-xenlib

      - name: Build zephyr-xenlib
        run: |
          west build -p always -b qemu_cortex_a53/qemu_cortex_a53/smp \
            zephyr/samples/hello_world \
            -S xen-dom0 -- \
            -DZEPHYR_EXTRA_MODULES="${GITHUB_WORKSPACE}/zephyr-xenlib" \
            -DDTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/zephyr-xenlib/.github/ci/qemu_cortex_a53.overlay" \
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/zephyr-xenlib/.github/ci/zephyr-xenlib.conf"

